name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make libsdl2-dev libglew-dev libglu1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri xvfb mesa-utils

      - name: Build the single ElectroBench binary
        run: make

      - name: Headless runtime smoke test (45 s ocean scene on llvmpipe)
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 timeout 240 xvfb-run -a -s "-screen 0 1366x768x24" ./build/ElectroBench --scene-only 2>&1 | tee run.log
          grep -q "Benchmark Results" run.log
          cat run.log
