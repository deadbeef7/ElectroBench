name: Android emulator run

# Runs ports/ElectroBench-android.apk on a KVM-accelerated x86_64 emulator, so
# the GLES3 port can be exercised on a machine that cannot virtualise Android
# itself (the app needs ES 3.0; a Core 2 era desktop with GMA graphics has no
# usable VT-x and no GLES3 driver).
#
# The run is meant to answer "why did it go back to the launcher": it keeps the
# app's own portlog/stdout (which carry the render phase a fatal signal landed
# in, and a frame heartbeat), the emulator's crash buffer, tombstones, DropBox
# crash records and ActivityManager's per-process exit info, then says in the
# job summary whether the benchmark finished or died and where.
#
# Start it by hand from the Actions tab, or push to the ports branch.

on:
  workflow_dispatch:
  push:
    branches: [ports]
    paths:
      - 'ports/ElectroBench-android.apk'
      - 'ports/android/**'
      - '.github/workflows/android-emulator.yml'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM access for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the emulator, install the APK and run a scene
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          # google_apis (not playstore) allows `adb root`, which is what makes
          # /sdcard/Android/data and /data/tombstones readable.
          target: google_apis
          arch: x86_64
          # 768x1280: close to the 720x1650 phone this crashes on, and small
          # enough that the software rasteriser still presents frames.
          profile: Nexus 4
          disable-animations: true
          # The default emulator options (-no-window -gpu swiftshader_indirect
          # -no-snapshot ...) are what this needs: the runner has no GPU, and
          # SwiftShader still gives the app a working ES 3.0 context.
          script: |
            set -euo pipefail

            APK=ports/ElectroBench-android.apk
            PKG=org.deadbeef7.electrobench
            RUN_DIR=/sdcard/Android/data/$PKG/files
            OUT=emulator-artifacts
            mkdir -p "$OUT"

            adb wait-for-device
            # getprop can answer before the framework is up, unlike the runner's
            # own boot wait, so poll the boot flag as well.
            for _ in $(seq 1 120); do
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
              sleep 2
            done

            {
              echo "apk:      $(sha256sum "$APK")"
              echo "sdk:      $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "release:  $(adb shell getprop ro.build.version.release | tr -d '\r')"
              echo "abi:      $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
              echo "product:  $(adb shell getprop ro.product.model | tr -d '\r')"
            } | tee "$OUT/device.txt"

            adb root || true
            adb wait-for-device
            sleep 2
            adb shell id >> "$OUT/device.txt" || true

            # Keep enough buffer that a crash early in the scene still survives
            # to the end of the run.
            adb logcat -G 16M || true
            adb logcat -c || true

            adb install -r "$APK" | tee "$OUT/install.txt"
            adb shell pm list packages | grep -qx "package:$PKG"

            # The port reads getExternalFilesDir()/electrobench.txt on launch.
            # only=1 runs the dusk ocean scene alone; the shots are the times at
            # which it also writes a PNG into that same directory.
            adb shell mkdir -p "$RUN_DIR"
            printf 'only=1\nshots=45.1,46.5\n' \
              | adb shell "cat > $RUN_DIR/electrobench.txt" || \
              echo "::warning::could not write the run spec; the port will use its defaults (both scenes)"

            adb shell am start -W -n "$PKG/android.app.NativeActivity" | tee "$OUT/launch.txt"

            # The benchmark is wall-clock: 45 s scene plus a 4 s results screen.
            # Poll until it finishes, or until the process is gone (a crash to
            # the launcher, which is the case this workflow exists for).
            finished=0
            for i in $(seq 1 120); do
              if adb shell "grep -q 'Benchmark Results' '$RUN_DIR/stdout.txt'" 2>/dev/null; then
                finished=1
                break
              fi
              if ! adb shell pidof "$PKG" >/dev/null 2>&1; then
                if adb shell "grep -q 'benchmark finished' '$RUN_DIR/stdout.txt'" 2>/dev/null; then
                  finished=1
                fi
                break
              fi
              # Every ~16 s, photograph the device: it shows the app drawing, or
              # the launcher it fell back to.
              if [ $((i % 8)) -eq 0 ]; then
                adb exec-out screencap -p > "$OUT/screen-$i.png" || rm -f "$OUT/screen-$i.png"
              fi
              sleep 2
            done
            echo "benchmark finished: $finished"

            # ---- everything that survives the process ---------------------
            adb wait-for-device
            adb pull "$RUN_DIR" "$OUT/$PKG" 2>&1 | tail -3 | tee "$OUT/pull.txt" || true
            adb logcat -d > "$OUT/logcat.txt" || true
            adb logcat -d -b crash > "$OUT/logcat-crash.txt" || true
            adb logcat -d -s ElectroBench:V > "$OUT/logcat-electrobench.txt" || true
            adb shell dumpsys activity exit-info "$PKG" > "$OUT/exit-info.txt" 2>&1 || true
            adb shell dumpsys dropbox --print data_app_crash > "$OUT/dropbox-crash.txt" 2>&1 || true
            adb shell dumpsys dropbox --print data_app_anr > "$OUT/dropbox-anr.txt" 2>&1 || true
            adb shell 'ls -l /data/tombstones 2>/dev/null; for f in /data/tombstones/tombstone_*; do
                         echo "== $f"; cat "$f"; done' > "$OUT/tombstones.txt" 2>&1 || true
            ls -lR "$OUT"

      - name: Upload the log, screenshots and crash records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electrobench-emulator
          path: emulator-artifacts
          if-no-files-found: warn

      - name: Say whether it finished, and where it died
        if: always()
        run: |
          set -uo pipefail

          OUT=emulator-artifacts
          RUN=$OUT/org.deadbeef7.electrobench
          LOG=$RUN/stdout.txt
          PORT=$RUN/portlog.txt
          verdict=unknown

          if [ -f "$LOG" ] && grep -q "Benchmark Results" "$LOG"; then
            verdict=finished
          elif [ -f "$LOG" ] && grep -q "FATAL signal" "$LOG"; then
            verdict=crashed
          elif [ -f "$LOG" ]; then
            verdict=stopped
          fi

          {
            echo "## ElectroBench on the Android emulator"
            echo
            echo "API 33, x86_64, 768x1280, SwiftShader software ES 3.0: a renderer"
            echo "correctness run, not a GPU score."
            echo
            echo "**Verdict: \`$verdict\`**"
            echo
            if [ "$verdict" = finished ]; then
              echo '```'
              grep "Benchmark Results" "$LOG"
              echo '```'
            fi
            if [ -f "$LOG" ] && grep -q "FATAL signal" "$LOG"; then
              echo "The port caught a fatal signal and named the phase it was in:"
              echo
              echo '```'
              grep -n "FATAL signal" "$LOG"
              echo '```'
              echo
              echo "Last 20 lines of the port's own log:"
              echo
              echo '```'
              tail -20 "$PORT" 2>/dev/null || tail -20 "$LOG"
              echo '```'
            fi
            if [ -f "$OUT/device.txt" ]; then
              echo "Device:"
              echo
              echo '```'
              cat "$OUT/device.txt"
              echo '```'
            fi
            if [ -f "$PORT" ]; then
              echo "Renderer, limits and frames:"
              echo
              echo '```'
              grep -E "renderer|version  :|GL_|first presented frame|heartbeat" "$PORT" | head -30
              echo '```'
            fi
            for f in exit-info:exit-info.txt dropbox-crash:dropbox-crash.txt logcat-crash:logcat-crash.txt; do
              name=${f%%:*}
              file=$OUT/${f#*:}
              if [ -s "$file" ]; then
                echo "<details><summary>$name</summary>"
                echo
                echo '```'
                grep -iE "reason|exit|crash|signal|FATAL|Exception|ANR|tombstone" "$file" | head -40
                echo '```'
                echo "</details>"
                echo
              fi
            done
            echo "The full bundle (portlog, tombstones, logcat, screenshots) is the"
            echo "\`electrobench-emulator\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

          # A run that never reached the results line is a failure, not a pass.
          [ "$verdict" = finished ]
